[pytest]
# Pytest configuration for Prema RAG Knowledge Assistant

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --showlocals
    -p no:warnings

# Markers
markers =
    e2e: End-to-end tests that require running servers
    api: API endpoint tests
    ui: Streamlit UI tests
    slow: Tests that take a long time to run

# Asyncio configuration
asyncio_mode = auto

# Coverage (if pytest-cov is installed)
# --cov=app
# --cov-report=html
# --cov-report=term-missing
